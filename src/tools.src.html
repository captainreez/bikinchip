<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools · bikinchip</title>
<meta name="description" content="Kalkulator engineer IC design: konstanta waktu RC, dB, daya dinamis, slack setup/hold, MTBF, ENOB, dan lainnya. Bisa di-deep-link.">
<!--CORE-->
<!--PAGES-->
</head>
<body data-file="tools">
<main class="wide">
<div class="pg">
  <h1>Tools</h1>
  <p class="lead">Kalkulator engineer. Angka boleh memakai akhiran SI: <code>10k</code>, <code>4.7n</code>, <code>100p</code>, <code>2.5G</code>, <code>1e-12</code>. Pemisah desimal memakai titik, sama seperti tool EDA.</p>
  <div id="tabs" class="no-print" style="margin-bottom:var(--sp-4)"></div>
  <div class="icd-card" id="c-box" role="tabpanel" aria-live="polite"></div>
  <p class="icd-small icd-muted">Tiap kalkulator punya tautan sendiri, misalnya <code>tools.html#rc</code>, jadi bisa dirujuk dari catatan atau diskusi.</p>
</div>
</main>
<script>
(function(){
'use strict';
var ICD = window.ICD, q = ICD.q, list = ICD.calc.list, tabs;
function idx(){ var h = (window.location.hash || '').slice(1), i = list.findIndex(function(c){ return c.id === h; }); return i < 0 ? 0 : i; }
function show(i, push){
  ICD.calc.mount('#c-box', list[i].id); document.title = list[i].title + ' · Tools · bikinchip';
  if (push){ try { history.replaceState(null, '', '#' + list[i].id); } catch (e) {} }
}
ICD.ready(function(){
  var start = idx();
  tabs = ICD.ui.tabs(list.map(function(c){ return c.title; }), function(i){ show(i, true); }, { label: 'Pilih kalkulator', selected: start });
  q('#tabs').appendChild(tabs); show(start, false);
  window.addEventListener('hashchange', function(){ var i = idx(); tabs.select(i); });
});
})();
</script>
</body>
</html>
