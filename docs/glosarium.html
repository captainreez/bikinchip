alue","idn":"nilai rata-rata","def":"Integral sinyal selama selang T dibagi T.","mods":["M01b"]},{"id":"backtracking","en":"backtracking","idn":"penelusuran mundur","def":"Strategi mesin regex yang mencoba satu pilihan lalu mundur ke pilihan lain bila gagal; pada pola bersarang seperti (a+)+b langkahnya berlipat dua per huruf (ReDoS).","mods":["M04c"]},{"id":"bandwidth","en":"bandwidth","idn":"lebar pita","def":"Rentang frekuensi yang dilewatkan sistem; lazimnya sampai titik −3 dB.","mods":["M01d"]},{"id":"binomial-distribution","en":"binomial distribution","idn":"distribusi binomial","def":"Sebaran jumlah keberhasilan dalam n percobaan bebas berpeluang p.","mods":["M01c"]},{"id":"bit","en":"bit","idn":"bit","def":"Satuan informasi terkecil: 0 atau 1; di chip, dua tingkat tegangan.","mods":["M03a"]},{"id":"bit-error-rate","en":"bit error rate","idn":"laju galat bit","def":"Peluang sebuah bit salah (atau fraksi bit salah) pada kanal atau memori; dipakai sebagai p dalam analisis kode galat.","mods":["M03b, M28, M29"]},{"id":"bode-plot","en":"Bode plot","idn":"diagram Bode","def":"Grafik magnitudo (dB) dan fase (derajat) fungsi transfer terhadap frekuensi pada sumbu logaritmik.","mods":["M02c"]},{"id":"bounce-diagram","en":"bounce diagram","idn":"diagram pantulan","def":"Diagram waktu-jarak yang melacak gelombang yang memantul bolak-balik antara sumber dan beban.","mods":["M02c"]},{"id":"burst-error","en":"burst error","idn":"galat burst","def":"Galat beruntun yang mengenai bit-bit bertetangga; panjangnya diukur dari bit salah pertama hingga terakhir.","mods":["M03b, M28"]},{"id":"butterworth-filter","en":"Butterworth filter","idn":"filter Butterworth","def":"Filter dengan respons datar maksimal di pita lolos: |H|² = 1/(1 + (f/fc)^(2n)).","mods":["M02c"]},{"id":"byte","en":"byte","idn":"byte","def":"Kelompok 8 bit; unit alamat memori yang umum.","mods":["M03a"]},{"id":"cache","en":"cache","idn":"cache","def":"Memori kecil dan cepat yang menyimpan salinan data yang seri ":"combination","en":"combination","idn":"kombinasi","def":"Banyaknya cara memilih k dari n tanpa urutan: n!/(k!(n−k)!).","mods":["M01c"]},{"id":"companion-model","en":"companion model","idn":"model pendamping","def":"Pengganti kapasitor atau induktor dalam satu langkah waktu: konduktansi plus sumber arus.","mods":["M02b"]},{"id":"complex-conjugate","en":"complex conjugate","idn":"konjugat kompleks","def":"Bilangan a − jb dari a + jb; hasil kali keduanya adalah |z|².","mods":["M01b"]},{"id":"complex-number","en":"complex number","idn":"bilangan kompleks","def":"Bilangan berbentuk a + jb dengan bagian real a dan bagian imajiner b.","mods":["M01b"]},{"id":"complex-plane","en":"complex plane","idn":"bidang kompleks","def":"Bidang dengan sumbu mendatar real dan sumbu tegak imajiner; tempat bilangan kompleks digambar.","mods":["M01b"]},{"id":"conductance","en":"conductance","idn":"konduktansi","def":"Kebalikan resistansi, G = 1/R, dalam siemens.","mods":["M02a"]},{"id":"context-switch","en":"context switch","idn":"perpindahan konteks","def":"Pergantian proses di CPU: menyimpan dan memuat register serta mengganti tabel halaman; biaya langsungnya kecil, biaya cache dan TLB dingin lebih besar.","mods":["M04b, M13"]},{"id":"convolution","en":"convolution","idn":"konvolusi","def":"Operasi y[n] = Σ h[k]·x[n−k] yang memberi keluaran sistem LTI dari masukan dan respons impulsnya.","mods":["M01d"]},{"id":"copy-on-write","en":"copy-on-write","idn":"salin-saat-menulis","def":"Teknik berbagi halaman fisik secara baca-saja setelah fork; halaman disalin hanya ketika salah satu proses menulis.","mods":["M04b, M13"]},{"id":"correlation","en":"correlation","idn":"korelasi","def":"Kecenderungan dua besaran acak naik dan turun bersama.","mods":["M01c"]},{"id":"coverage","en":"coverage","idn":"cakupan","def":"Ukuran seberapa banyak kode atau skenario yang sudah teruji.","mods":["M18"]},{"id":"critical-path","en":"critical path","idn":"path kritis","def":"Path dengan delay terlama; menentuka ods":["M17"]},{"id":"file-descriptor","en":"file descriptor","idn":"deskriptor berkas","def":"Bilangan kecil per proses yang menunjuk ke sebuah berkas, pipa, atau perangkat terbuka. Standar: 0 = stdin, 1 = stdout, 2 = stderr; pengalihan mengubah tujuan fd lewat dup2.","mods":["M04b, M04c"]},{"id":"finfet","en":"FinFET","idn":"FinFET","def":"Transistor dengan kanal berbentuk sirip tegak yang dibungkus gate di tiga sisi.","mods":["M06"]},{"id":"fir-filter","en":"FIR filter","idn":"filter respons impuls terbatas","def":"Filter digital tanpa umpan balik; keluarannya jumlah berbobot sejumlah masukan terakhir.","mods":["M01d"]},{"id":"fixed-point","en":"fixed-point","idn":"titik tetap","def":"Bilangan bulat dengan skala 2^f yang disepakati: nilai = r/2^f; notasi Qi.f.","mods":["M03a"]},{"id":"flip-flop","en":"flip-flop","idn":"flip-flop","def":"Elemen memori yang menangkap data hanya pada clock edge (edge-triggered).","mods":["M09"]},{"id":"floorplan","en":"floorplan","idn":"floorplan","def":"Penataan awal area die: posisi macro, I/O, dan jalur daya.","mods":["M23"]},{"id":"foundry","en":"foundry","idn":"foundry","def":"Perusahaan yang memproduksi chip rancangan pihak lain.","mods":["M00, M30"]},{"id":"fourier-series","en":"Fourier series","idn":"deret Fourier","def":"Penguraian sinyal periodik menjadi jumlah sinus dan cosinus pada kelipatan frekuensi dasarnya.","mods":["M01d"]},{"id":"fourier-transform","en":"Fourier transform","idn":"transformasi Fourier","def":"Pemetaan sinyal waktu ke kandungan frekuensinya, X(f) = ∫ x(t)·e^(−j2πft) dt.","mods":["M01d"]},{"id":"frequency","en":"frequency","idn":"frekuensi","def":"Jumlah siklus per detik; satuannya hertz (Hz).","mods":["M01a"]},{"id":"frequency-response","en":"frequency response","idn":"respons frekuensi","def":"Gain dan geseran fase sebuah sistem linear sebagai fungsi frekuensi; H(jω) atau H(e^(jΩ)).","mods":["M01d"]},{"id":"fsm","en":"FSM","idn":"FSM","def":"Rangkaian sekuensial yang berpindah antar sejumlah keadaan terbatas berdasarkan input.","mods":["M09"]},{"id":"function","en":"function","idn":"fungsi","def":"Aturan yang memberi tepat satu keluaran untuk setiap masukan.","mods":["M01a"]},{"id":"fundamental-theorem-of-calculus","en":"fundamental theorem of calculus","idn":"teorema dasar kalkulus","def":"Integral f dari a ke b sama dengan F(b) − F(a), dengan F antiturunan f.","mods":["M01b"]},{"id":"gaa","en":"GAA","idn":"gate-all-around","def":"Transistor yang gate-nya membungkus kanal di semua sisi, misalnya nanosheet.","mods":["M06"]},{"id":"gaussian-elimination","en":"Gaussian elimination","idn":"eliminasi Gauss","def":"Penyelesaian sistem linear dengan menolkan elemen di bawah diagonal lalu substitusi mundur.","mods":["M01c"]},{"id":"gdsii","en":"GDSII","idn":"GDSII","def":"Format file layout akhir yang dikirim ke foundry.","mods":["M24"]},{"id":"gibbs-phenomenon","en":"Gibbs phenomenon","idn":"fenomena Gibbs","def":"Lonjakan sekitar 9% dari tinggi lompatan yang selalu muncul di dekat tepi saat deret Fourier dipotong.","mods":["M01d"]},{"id":"git-blob","en":"Git blob","idn":"blob Git","def":"Objek Git untuk isi sebuah berkas; ID = SHA-1(\"blob panjang\\0\" + isi). Isi sama menghasilkan ID sama, sehingga disimpan sekali.","mods":["M04c"]},{"id":"graph","en":"graph","idn":"graf","def":"Struktur yang terdiri dari simpul dan sisi yang menghubungkannya.","mods":["M01c"]},{"id":"gray-code","en":"Gray code","idn":"kode Gray","def":"Urutan bit tempat dua nilai berurutan berbeda tepat satu bit: g = b ⊕ (b ≫ 1). Dipakai untuk pointer lintas clock domain.","mods":["M03b, M09"]},{"id":"ground","en":"ground","idn":"ground","def":"Simpul acuan yang tegangannya didefinisikan nol.","mods":["M02a"]},{"id":"group-delay","en":"group delay","idn":"delay grup","def":"τg = −dφ/dω; waktu tunda yang dialami pita sempit di sekitar sebuah frekuensi.","mods":["M02c"]},{"id":"hamming-code","en":"Hamming code","idn":"kode Hamming","def":"Kode koreksi satu galat: bit cek di posisi pangkat dua; syndrome sama dengan nomor posisi yang salah. Hamming(7,4) berjarak minimum 3.","mods":["M03b, M29"]},{"id":"hamming-distance","en":"Hamming distance","idn":"jarak Hamming","def":"Jumlah posisi bit yang berbeda antara dua kata: popcount(x ⊕ y). Jarak minimum kode d menentukan: deteksi d − 1 galat, koreksi ⌊(d − 1)/2⌋.","mods":["M03b, M26, M29"]},{"id":"handshake","en":"handshake","idn":"handshake","def":"Protokol dua sinyal (misalnya valid dan ready) agar pengirim dan penerima sepakat kapan data berpindah.","mods":["M17"]},{"id":"harmonic","en":"harmonic","idn":"harmonik","def":"Komponen sinus pada kelipatan bulat frekuensi dasar sebuah sinyal periodik.","mods":["M01d"]},{"id":"hazard","en":"hazard","idn":"hazard","def":"Pada prosesor: situasi ketika instruksi berikutnya tidak bisa langsung dijalankan dengan benar di pipeline.","mods":["M12"]},{"id":"hdl","en":"HDL","idn":"bahasa deskripsi hardware","def":"Bahasa untuk mendeskripsikan rangkaian digital, misalnya SystemVerilog dan VHDL.","mods":["M00, M16"]},{"id":"heap","en":"heap","idn":"heap","def":"Daerah memori untuk alokasi dinamis (malloc dan free) yang masa hidupnya diatur programer.","mods":["M04a, M04b"]},{"id":"hexadecimal","en":"hexadecimal","idn":"heksadesimal","def":"Basis 16; satu digit mewakili empat bit (nibble), sehingga 0xB5 = 1011 0101.","mods":["M03a"]},{"id":"hold-time","en":"hold time","idn":"hold time","def":"Lama data harus tetap stabil setelah clock edge.","mods":["M09"]},{"id":"identity-matrix","en":"identity matrix","idn":"matriks identitas","def":"Matriks dengan 1 di diagonal dan 0 di tempat lain; A·I = A.","mods":["M01c"]},{"id":"ieee-754","en":"IEEE 754","idn":"IEEE 754","def":"Standar bilangan titik mengambang: tanda, eksponen terbias, pecahan, dengan nol, subnormal, tak hingga, dan NaN.","mods":["M03a"]},{"id":"iir-filter","en":"IIR filter","idn":"filter respons impuls tak terbatas","def":"Filter digital dengan umpan balik; keluarannya juga bergantung pada keluaran sebelumnya.","mods":["M01d"]},{"id":"imaginary-unit-j","en":"imaginary unit j","idn":"satuan imajiner","def":"Bilangan yang kuadratnya −1; engineer menulis j karena i dipakai untuk arus.","mods":["M01b"]},{"id":"impedance","en":"impedance","idn":"impedansi","def":"Perbandingan fasor tegangan terhadap fasor arus; R, 1/(jωC), jωL.","mods":["M02b"]},{"id":"impulse","en":"impulse","idn":"impuls","def":"Sinyal yang bernilai hanya pada satu saat; pada waktu diskret, 1 di n = 0 dan 0 di tempat lain.","mods":["M01d"]},{"id":"impulse-response","en":"impulse response","idn":"respons impuls","def":"Keluaran sistem saat diberi impuls; menentukan sistem LTI sepenuhnya.","mods":["M01d"]},{"id":"independent","en":"independent","idn":"saling bebas","def":"Dua kejadian yang terjadinya satu tidak mengubah peluang yang lain.","mods":["M01c"]},{"id":"inductance","en":"inductance","idn":"induktansi","def":"Besaran yang menghubungkan tegangan dengan laju perubahan arus, v = L·di/dt, dalam henry.","mods":["M02b"]},{"id":"integral","en":"integral","idn":"integral","def":"Luas bertanda di bawah kurva; penjumlahan terus-menerus sebuah laju.","mods":["M01b"]},{"id":"integrated-circuit-ic","en":"integrated circuit (IC)","idn":"rangkaian terpadu","def":"Rangkaian elektronik yang seluruh komponennya dibuat bersama pada sekeping semikonduktor; sehari-hari disebut chip.","mods":["M00"]},{"id":"inverse-matrix","en":"inverse matrix","idn":"matriks invers","def":"Matriks A⁻¹ yang memenuhi A⁻¹·A = I.","mods":["M01c"]},{"id":"ip-core","en":"IP core","idn":"blok IP","def":"Blok desain siap pakai yang dilisensikan, misalnya inti prosesor atau antarmuka USB.","mods":["M00, M15"]},{"id":"ir-drop","en":"IR drop","idn":"IR drop","def":"Penurunan tegangan catu akibat arus yang melewati resistansi jaringan catu daya.","mods":["M02a, M23","M23"]},{"id":"kirchhoff-current-law","en":"Kirchhoff current law","idn":"hukum arus Kirchhoff","def":"Jumlah arus yang keluar dari sebuah simpul sama dengan nol.","mods":["M02a"]},{"id":"kirchhoff-voltage-law","en":"Kirchhoff voltage law","idn":"hukum tegangan Kirchhoff","def":"Jumlah tegangan di sepanjang loop tertutup sama dengan nol.","mods":["M02a"]},{"id":"l-di-dt-noise","en":"L di/dt noise","idn":"noise L di/dt","def":"Penurunan tegangan akibat perubahan arus cepat yang melewati induktansi, v = L·di/dt.","mods":["M02b, M23"]},{"id":"laplace-transform","en":"Laplace transform","idn":"transformasi Laplace","def":"Pemetaan sinyal waktu ke variabel kompleks s; mengubah turunan menjadi perkalian dengan s.","mods":["M01d"]},{"id":"latch","en":"latch","idn":"latch","def":"Elemen memori yang transparan selama sinyal enable aktif (level-sensitive).","mods":["M09"]},{"id":"leakage","en":"leakage","idn":"arus bocor","def":"Arus yang tetap mengalir saat transistor seharusnya mati.","mods":["M06"]},{"id":"least-significant-bit","en":"least significant bit","idn":"bit paling kanan (LSB)","def":"Bit berbobot 2⁰; dalam fixed-point, juga satuan resolusi terkecil.","mods":["M03a"]},{"id":"limit","en":"limit","idn":"limit","def":"Nilai yang didekati sebuah ungkapan saat variabelnya mendekati suatu nilai.","mods":["M01b"]},{"id":"linear-feedback-shift-register","en":"linear-feedback shift register","idn":"LFSR","def":"Register geser dengan umpan balik XOR pada tap tertentu; menghitung CRC, membangkitkan pola uji, dan mengacak data.","mods":["M03b, M26"]},{"id":"linker","en":"linker","idn":"linker (penaut)","def":"Program yang menggabungkan berkas objek: menempatkan bagian pada alamat, meresolusi simbol, menambal relokasi, dan menghasilkan eksekutabel.","mods":["M04b, M15"]},{"id":"logarithm","en":"logarithm","idn":"logaritma","def":"Kebalikan eksponen: log_b(x) adalah pangkat yang harus diberikan pada b untuk menghasilkan x.","mods":["M01a"]},{"id":"logic-synthesis","en":"logic synthesis","idn":"sintesis logika","def":"Penerjemahan RTL menjadi netlist gerbang dari library tertentu.","mods":["M21"]},{"id":"lti-system","en":"LTI system","idn":"sistem linear tak berubah waktu","def":"Sistem yang memenuhi superposisi dan yang perilakunya tidak bergantung pada kapan masukan diberikan.","mods":["M01d"]},{"id":"lvs","en":"LVS","idn":"layout versus schematic","def":"Pemeriksaan bahwa layout secara listrik sama dengan netlist.","mods":["M24"]},{"id":"make-target","en":"make target","idn":"target make","def":"Berkas (atau nama palsu .PHONY) yang dibangun oleh sebuah aturan make: target: prasyarat, diikuti resep yang diawali tab. Dibangun ulang bila ada prasyarat yang lebih baru.","mods":["M04c"]},{"id":"matrix","en":"matrix","idn":"matriks","def":"Tabel bilangan berbaris dan berkolom dengan aturan penjumlahan dan perkalian.","mods":["M01c"]},{"id":"maximum-power-transfer","en":"maximum power transfer","idn":"transfer daya maksimum","def":"Daya beban terbesar Vth²/(4Rth), tercapai saat resistansi beban sama dengan Rth.","mods":["M02a"]},{"id":"mean","en":"mean","idn":"rata-rata","def":"Pusat sebuah sebaran; jumlah nilai dibagi banyaknya.","mods":["M01c"]},{"id":"memory-mapped-i-o","en":"memory-mapped I/O","idn":"I/O terpeta memori","def":"Register peripheral yang muncul sebagai alamat di ruang memori sehingga dibaca dan ditulis dengan instruksi load dan store biasa.","mods":["M04a, M15"]},{"id":"mesh-analysis","en":"mesh analysis","idn":"analisis mesh","def":"Metode yang memakai arus mesh sebagai variabel dan KVL sebagai persamaan.","mods":["M02a"]},{"id":"metastability","en":"metastability","idn":"metastabilitas","def":"Keadaan tak tentu sementara pada flip-flop ketika data berubah terlalu dekat dengan clock edge.","mods":["M09"]},{"id":"modified-nodal-analysis","en":"modified nodal analysis","idn":"analisis nodal termodifikasi","def":"Analisis nodal yang menambahkan arus sumber tegangan sebagai variabel; formulasi SPICE.","mods":["M02a"]},{"id":"modular-arithmetic","en":"modular arithmetic","idn":"aritmetika modular","def":"Aritmetika pada sisa pembagian; register n bit menghitung mod 2ⁿ.","mods":["M01c"]},{"id":"monte-carlo","en":"Monte Carlo","idn":"Monte Carlo","def":"Menaksir statistik sebuah sistem dengan mengulang perhitungan pada masukan acak.","mods":["M01c"]},{"id":"moving-average","en":"moving average","idn":"rata-rata bergerak","def":"Filter FIR yang keluarannya rata-rata M sampel masukan terakhir.","mods":["M01d"]},{"id":"natural-frequency","en":"natural frequency","idn":"frekuensi alami","def":"Parameter ω0 sistem orde dua; untuk LC sebesar 1/√(LC).","mods":["M01b"]},{"id":"netlist","en":"netlist","idn":"netlist","def":"Daftar komponen beserta sambungan antar pin.","mods":["M21"]},{"id":"nodal-analysis","en":"nodal analysis","idn":"analisis nodal","def":"Metode yang memakai tegangan simpul sebagai variabel dan KCL sebagai persamaan.","mods":["M02a"]},{"id":"normal-distribution","en":"normal distribution","idn":"distribusi normal","def":"Sebaran berbentuk lonceng yang ditentukan oleh μ dan σ; disebut juga Gaussian.","mods":["M01c"]},{"id":"norton-equivalent","en":"Norton equivalent","idn":"setara Norton","def":"Sumber arus IN paralel resistor Rth yang setara dengan rangkaian linear dilihat dari dua terminal.","mods":["M02a"]},{"id":"not-a-number","en":"not a number","idn":"NaN","def":"Nilai float untuk hasil tak terdefinisi (0/0, ∞ − ∞); tidak sama dengan apa pun, termasuk dirinya.","mods":["M03a"]},{"id":"nyquist-frequency","en":"Nyquist frequency","idn":"frekuensi Nyquist","def":"Setengah laju sampling; frekuensi tertinggi yang terwakili tanpa aliasing.","mods":["M01d"]},{"id":"octave","en":"octave","idn":"oktaf","def":"Faktor dua pada skala logaritmik.","mods":["M01a"]},{"id":"order-of-magnitude","en":"order of magnitude","idn":"orde besaran","def":"Pangkat sepuluh terdekat dari sebuah nilai; selisih satu orde berarti sepuluh kali.","mods":["M01a"]},{"id":"overflow-flag","en":"overflow flag","idn":"flag overflow","def":"Hasil bertanda salah: operand bertanda sama, hasil bertanda berbeda; sama dengan carry masuk ≠ carry keluar MSB.","mods":["M03a, M08b, M11"]},{"id":"overshoot","en":"overshoot","idn":"lonjakan lewat","def":"Seberapa jauh respons melewati nilai akhirnya, biasanya dalam persen.","mods":["M01b"]},{"id":"package","en":"package","idn":"kemasan","def":"Pembungkus die yang melindunginya dan menyediakan sambungan listrik ke papan rangkaian.","mods":["M00, M31"]},{"id":"padding","en":"padding","idn":"padding","def":"Byte kosong yang disisipkan kompiler di antara field atau di ekor struct untuk menjaga perataan; isinya tak terdefinisi.","mods":["M04a"]},{"id":"page-table-entry","en":"page table entry","idn":"entri tabel halaman","def":"Entri yang memuat bit hadir, nomor frame fisik, dan izin baca, tulis, eksekusi untuk satu halaman virtual; PA = frame · ukuran halaman + offset.","mods":["M04b, M13"]},{"id":"parity-bit","en":"parity bit","idn":"bit paritas","def":"Satu bit tambahan yang membuat jumlah bit satu genap (atau ganjil); mendeteksi galat berjumlah ganjil, tidak menunjukkan lokasi.","mods":["M03b, M29"]},{"id":"pdk","en":"PDK","idn":"process design kit","def":"Paket dari foundry berisi model device, design rules, dan file teknologi.","mods":["M23"]},{"id":"period","en":"period","idn":"periode","def":"Lama satu siklus; kebalikan frekuensi (T = 1/f).","mods":["M01a"]},{"id":"phase","en":"phase","idn":"fase","def":"Posisi sudut sebuah gelombang pada saat tertentu; selisih fase setara dengan geseran waktu.","mods":["M01a"]},{"id":"phase-margin","en":"phase margin","idn":"margin fase","def":"PM = 180° + fase gain loop pada frekuensi gain satu; ukuran jarak dari ketidakstabilan.","mods":["M02c, M27"]},{"id":"phasor","en":"phasor","idn":"fasor","def":"Bilangan kompleks A∠φ yang mewakili sinyal A·cos(ωt + φ) pada frekuensi yang disepakati.","mods":["M01b"]},{"id":"pipe","en":"pipe","idn":"pipa","def":"Penyangga di kernel (sekitar 64 KiB di Linux) yang menghubungkan stdout satu proses ke stdin proses lain; kedua proses berjalan serentak.","mods":["M04c"]},{"id":"pipeline","en":"pipeline","idn":"pipeline","def":"Pembagian pekerjaan menjadi tahap berurutan yang dipisah register agar beberapa operasi berjalan bersamaan.","mods":["M12"]},{"id":"pivot","en":"pivot","idn":"pivot","def":"Elemen diagonal yang dipakai sebagai pembagi pada satu tahap eliminasi.","mods":["M01c"]},{"id":"pll","en":"PLL","idn":"phase-locked loop","def":"Loop umpan balik yang mengunci fase osilator ke clock referensi; dipakai untuk membangkitkan clock.","mods":["M28"]},{"id":"pointer","en":"pointer","idn":"pointer","def":"Variabel yang menyimpan alamat sebuah objek bertipe; p + n bergerak n elemen, yaitu n·sizeof(*p) byte.","mods":["M04a, M04b, M11, M18"]},{"id":"poisson-distribution","en":"Poisson distribution","idn":"distribusi Poisson","def":"Sebaran jumlah kejadian langka dengan rata-rata λ; P(0) = e^(−λ).","mods":["M01c"]},{"id":"pole","en":"pole","idn":"kutub","def":"Akar penyebut fungsi transfer; menentukan bentuk respons alami dan kestabilan.","mods":["M01d"]},{"id":"power","en":"power","idn":"daya","def":"Laju energi, P = V·I, dalam watt.","mods":["M02a"]},{"id":"power-distribution-network","en":"power distribution network","idn":"jaringan catu daya","def":"Jaring kawat logam dan via yang menyalurkan VDD dan VSS dari pad atau bump ke setiap sel.","mods":["M02a, M23"]},{"id":"ppa","en":"PPA","idn":"performance, power, area","def":"Tiga besaran yang selalu ditawar dalam desain chip: kinerja, daya, dan luas.","mods":["M00"]},{"id":"probability","en":"probability","idn":"peluang","def":"Bilangan dari 0 sampai 1 yang menyatakan seberapa sering sebuah kejadian terjadi.","mods":["M01c"]},{"id":"process","en":"process","idn":"proses","def":"Program yang sedang berjalan dengan ruang alamat virtual sendiri, keadaan CPU, dan sumber daya yang dicatat kernel.","mods":["M04b, M13"]},{"id":"process-node","en":"process node","idn":"node proses","def":"Nama generasi teknologi fabrikasi; pada node modern ini label pemasaran, bukan ukuran fisik.","mods":["M00, M30","M30"]},{"id":"product-rule","en":"product rule","idn":"aturan hasil kali","def":"(fg)′ = f′g + fg′.","mods":["M01b"]},{"id":"pvt-corner","en":"PVT corner","idn":"PVT corner","def":"Kombinasi ekstrem process, voltage, dan temperature yang dipakai untuk memastikan chip bekerja di semua kondisi.","mods":["M06"]},{"id":"quality-factor","en":"quality factor","idn":"faktor Q","def":"Q = 1/(2ζ); ukuran ketajaman resonansi dan lamanya ayunan.","mods":["M02b"]},{"id":"radian","en":"radian","idn":"radian","def":"Satuan sudut: sudut yang busurnya sepanjang jari-jari. Satu putaran = 2π radian.","mods":["M01a"]},{"id":"random-variable","en":"random variable","idn":"variabel acak","def":"Besaran yang nilainya ditentukan oleh hasil sesuatu yang acak.","mods":["M01c"]},{"id":"reactance","en":"reactance","idn":"reaktansi","def":"Bagian imajiner impedansi; ωL untuk induktor, −1/(ωC) untuk kapasitor.","mods":["M02b"]},{"id":"rebase","en":"rebase","idn":"rebase","def":"Memutar ulang rangkaian commit di atas dasar baru sehingga riwayat lurus. Tiap commit menjadi commit baru dengan ID baru; jangan dipakai pada cabang yang sudah dibagikan.","mods":["M04c"]},{"id":"reflection-coefficient","en":"reflection coefficient","idn":"koefisien pantul","def":"Γ = (ZL − Z0)/(ZL + Z0); perbandingan gelombang pantul terhadap gelombang datang di beban.","mods":["M02c"]},{"id":"regular-expression","en":"regular expression","idn":"ekspresi reguler","def":"Pola untuk himpunan string, dibangun dari konkatenasi, pilihan |, dan pengulangan *. Berbeda dari glob shell (*.v). Mesin otomaton bekerja O(n); mesin backtracking bisa eksponensial.","mods":["M04c"]},{"id":"relocation","en":"relocation","idn":"relokasi","def":"Catatan di berkas objek tentang field yang harus ditambal linker; nilai relatif PC = S + A − P, mis. rel32 = alamat sasaran − (alamat call + 5).","mods":["M04b"]},{"id":"resistance","en":"resistance","idn":"resistansi","def":"Perbandingan tegangan terhadap arus pada elemen yang mengikuti hukum Ohm, dalam ohm.","mods":["M02a"]},{"id":"resonance","en":"resonance","idn":"resonansi","def":"Keadaan saat reaktansi induktif dan kapasitif saling menghapus, pada ω0 = 1/√(LC).","mods":["M02b"]},{"id":"return-loss","en":"return loss","idn":"return loss","def":"RL = −20·log10|Γ| dalam dB; makin besar makin baik pencocokannya.","mods":["M02c"]},{"id":"riemann-sum","en":"Riemann sum","idn":"jumlah Riemann","def":"Penjumlahan luas persegi panjang tipis yang mendekati integral.","mods":["M01b"]},{"id":"rise-time","en":"rise time","idn":"waktu naik","def":"Waktu dari 10% ke 90% perubahan sebuah sinyal; untuk RC sebesar 2.2τ.","mods":["M01b"]},{"id":"rms","en":"RMS","idn":"nilai efektif","def":"Root mean square: akar dari rata-rata kuadrat; untuk sinus bernilai amplitudo dibagi √2.","mods":["M01a, M01b"]},{"id":"root-sum-of-squares-rss","en":"root sum of squares (RSS)","idn":"akar jumlah kuadrat","def":"Cara menggabungkan simpangan baku besaran yang saling bebas: √(σ₁² + σ₂²).","mods":["M01c"]},{"id":"rtl","en":"RTL","idn":"register-transfer level","def":"Tingkat deskripsi hardware berupa register dan logika di antaranya, ditulis dalam HDL.","mods":["M16"]},{"id":"runge-kutta-rk4","en":"Runge-Kutta (RK4)","idn":"Runge-Kutta orde empat","def":"Metode numerik yang merata-ratakan empat kemiringan per langkah; galat sebanding dengan h⁴.","mods":["M01b"]},{"id":"saturation","en":"saturation","idn":"saturasi","def":"Menempel hasil yang luap ke nilai maksimum atau minimum alih-alih membungkus.","mods":["M03a, M28"]},{"id":"scan-chain","en":"scan chain","idn":"scan chain","def":"Flip-flop yang dirangkai menjadi shift register saat mode test agar keadaan internal bisa dikendalikan dan diamati.","mods":["M26"]},{"id":"scientific-notation","en":"scientific notation","idn":"notasi ilmiah","def":"Penulisan bilangan sebagai m × 10^n dengan m antara 1 dan 10.","mods":["M01a"]},{"id":"scrubbing","en":"scrubbing","idn":"scrubbing","def":"Membaca, mengoreksi, dan menulis kembali memori secara berkala agar galat tunggal tidak menumpuk menjadi galat ganda.","mods":["M03b, M29, M32"]},{"id":"secant-line","en":"secant line","idn":"garis sekan","def":"Garis yang memotong kurva di dua titik.","mods":["M01b"]},{"id":"set","en":"set","idn":"himpunan","def":"Kumpulan benda tanpa urutan dan tanpa pengulangan.","mods":["M01c"]},{"id":"setup-time","en":"setup time","idn":"setup time","def":"Lama data harus stabil sebelum clock edge agar tertangkap dengan benar.","mods":["M09"]},{"id":"sheet-resistance","en":"sheet resistance","idn":"resistansi lembar","def":"Resistansi satu persegi lapisan tipis, Rs = ρ/t, dalam Ω/□; R = Rs·L/W.","mods":["M02a, M22"]},{"id":"shell","en":"shell","idn":"shell (cangkang perintah)","def":"Program yang membaca perintah, memperluas variabel, glob, dan kutip, mengatur pengalihan dan pipa, lalu menjalankan program lain lewat fork dan exec; contoh: bash.","mods":["M04c"]},{"id":"si","en":"SI","idn":"Sistem Internasional","def":"Sistem satuan baku dunia dengan tujuh satuan dasar: detik, meter, kilogram, ampere, kelvin, mol, kandela.","mods":["M01a"]},{"id":"sign-extension","en":"sign extension","idn":"perluasan tanda","def":"Memperlebar bilangan bertanda dengan menyalin MSB ke bit baru; nilai tidak berubah.","mods":["M03a, M16"]},{"id":"signal-to-quantization-noise-ratio","en":"signal-to-quantization-noise ratio","idn":"rasio sinyal terhadap noise kuantisasi","def":"Untuk sinus skala penuh dan N bit: SQNR ≈ 6.02·N + 1.76 dB.","mods":["M03a, M28"]},{"id":"significant-figures","en":"significant figures","idn":"angka penting","def":"Digit yang bermakna dalam sebuah nilai; menyatakan ketelitiannya.","mods":["M01a"]},{"id":"single-error-correct-double-error-detect","en":"single-error-correct, double-error-detect","idn":"SECDED","def":"Kode jarak minimum 4: mengoreksi satu galat dan mendeteksi dua; Hamming ditambah paritas keseluruhan. Tiga galat bisa salah-koreksi.","mods":["M03b, M29, M32"]},{"id":"singular-matrix","en":"singular matrix","idn":"matriks singular","def":"Matriks berdeterminan nol; tidak punya invers dan sistemnya tidak punya solusi tunggal.","mods":["M01c"]},{"id":"skin-effect","en":"skin effect","idn":"efek kulit","def":"Pada frekuensi tinggi arus terkumpul dekat permukaan konduktor; kedalaman δ = √(2ρ/(ωμ)).","mods":["M02c"]},{"id":"slack","en":"slack","idn":"slack","def":"Selisih antara waktu yang diwajibkan dan waktu tiba sinyal; negatif berarti pelanggaran.","mods":["M22"]},{"id":"slew-rate","en":"slew rate","idn":"laju perubahan tegangan","def":"Laju maksimum perubahan tegangan sebuah sinyal, misalnya dalam V/ns.","mods":["M01b"]},{"id":"slope","en":"slope","idn":"kemiringan","def":"Perubahan keluaran dibagi perubahan masukan; pada garis lurus nilainya tetap.","mods":["M01a"]},{"id":"spectrum","en":"spectrum","idn":"spektrum","def":"Besar (dan fase) kandungan sebuah sinyal sebagai fungsi frekuensi.","mods":["M01d"]},{"id":"sram","en":"SRAM","idn":"static RAM","def":"Memori yang menyimpan bit dalam pasangan inverter silang selama ada daya.","mods":["M29"]},{"id":"sta","en":"STA","idn":"static timing analysis","def":"Pemeriksaan timing semua path tanpa simulasi, dengan menjumlahkan delay.","mods":["M22"]},{"id":"standard-cell","en":"standard cell","idn":"sel standar","def":"Gerbang atau flip-flop siap pakai dengan tinggi seragam, bahan dasar implementasi digital.","mods":["M10"]},{"id":"standard-deviation","en":"standard deviation","idn":"simpangan baku","def":"Akar variansi; ukuran lebar sebaran, ditulis σ.","mods":["M01c"]},{"id":"subnormal-number","en":"subnormal number","idn":"bilangan subnormal","def":"Bilangan float dengan eksponen nol dan tanpa bit tersembunyi; mengisi celah antara nol dan bilangan normal terkecil.","mods":["M03a"]},{"id":"superposition","en":"superposition","idn":"superposisi","def":"Sifat sistem linear: respons terhadap jumlah masukan sama dengan jumlah respons terhadap masing-masing masukan.","mods":["M01d, M02a"]},{"id":"symbol","en":"symbol","idn":"simbol","def":"Nama fungsi atau variabel di tabel simbol berkas objek, dengan bagian, nilai, dan ikatan; nm menandai T (kode global), U (tak terdefinisi), D, B, R.","mods":["M04b"]},{"id":"syndrome","en":"syndrome","idn":"syndrome","def":"Hasil pemeriksaan paritas pada kata yang diterima; nol bila tak ada galat terdeteksi, dan pada Hamming sama dengan alamat bit yang salah.","mods":["M03b, M29"]},{"id":"system-call","en":"system call","idn":"panggilan sistem","def":"Permintaan program ke kernel lewat instruksi khusus; Linux x86-64: nomor di rax, argumen rdi, rsi, rdx, r10, r8, r9; write = 1, exit = 60.","mods":["M04b, M11"]},{"id":"tangent-line","en":"tangent line","idn":"garis singgung","def":"Garis yang menyentuh kurva di satu titik dengan kemiringan sama dengan turunannya.","mods":["M01b"]},{"id":"tapeout","en":"tapeout","idn":"tapeout","def":"Penyerahan layout final ke foundry untuk dibuat mask dan diproduksi.","mods":["M24"]},{"id":"termination","en":"termination","idn":"terminasi","def":"Resistor yang dipasang di sumber (seri) atau beban (paralel) agar pantulan hilang.","mods":["M02c, M28"]},{"id":"testbench","en":"testbench","idn":"testbench","def":"Kode yang membangkitkan stimulus dan memeriksa output desain saat simulasi.","mods":["M18"]},{"id":"thevenin-equivalent","en":"Thevenin equivalent","idn":"setara Thevenin","def":"Sumber tegangan Vth seri resistor Rth yang setara dengan rangkaian linear dilihat dari dua terminal.","mods":["M02a"]},{"id":"threshold-voltage","en":"threshold voltage","idn":"tegangan ambang","def":"Tegangan gate-source saat kanal MOSFET mulai menghantar secara berarti; ditulis Vth.","mods":["M06"]},{"id":"time-constant","en":"time constant","idn":"konstanta waktu","def":"Parameter τ sistem orde satu; waktu untuk menempuh 63.2% perubahan. Untuk RC, τ = RC.","mods":["M01b, M02"]},{"id":"topological-order","en":"topological order","idn":"urutan topologis","def":"Susunan simpul DAG sehingga setiap sisi mengarah dari yang lebih awal ke yang lebih akhir.","mods":["M01c"]},{"id":"transfer-function","en":"transfer function","idn":"fungsi transfer","def":"Perbandingan transformasi keluaran terhadap masukan sistem LTI, H(s) atau H(z).","mods":["M01d"]},{"id":"transient","en":"transient","idn":"transien","def":"Perilaku rangkaian saat berpindah dari satu keadaan tunak ke keadaan lain.","mods":["M02b"]},{"id":"transistor","en":"transistor","idn":"transistor","def":"Devais semikonduktor berkaki tiga yang bekerja sebagai saklar atau penguat; bata penyusun semua chip.","mods":["M00, M06"]},{"id":"transmission-line","en":"transmission line","idn":"saluran transmisi","def":"Penghantar yang diperlakukan sebagai medium perambatan gelombang dengan Z0 dan kecepatan v, bukan satu simpul.","mods":["M02c"]},{"id":"two-s-complement","en":"two's complement","idn":"komplemen dua","def":"Representasi bilangan bertanda dengan MSB berbobot −2^(n−1); negasi = balik bit lalu tambah 1.","mods":["M03","M03a, M08b, M11"]},{"id":"umask","en":"umask","idn":"umask","def":"Topeng bit izin pada pembuatan berkas: izin baru = izin dasar (666 berkas, 777 direktori) AND NOT umask; umask 022 memberi 644 dan 755.","mods":["M04c"]},{"id":"undefined-behavior","en":"undefined behavior","idn":"perilaku tak terdefinisi","def":"Kondisi yang standar C tidak mensyaratkan hasilnya; kompiler boleh mengasumsikan tak terjadi dan mengoptimalkan berdasarkan itu.","mods":["M04a, M32"]},{"id":"underdamped","en":"underdamped","idn":"kurang teredam","def":"Sistem orde dua dengan ζ < 1; responsnya berayun sebelum menetap.","mods":["M01b"]},{"id":"unit-in-the-last-place","en":"unit in the last place","idn":"ulp","def":"Jarak antara dua bilangan float bertetangga di sekitar sebuah nilai; 2^(e−M) untuk 2^e ≤ |x| < 2^(e+1).","mods":["M03a"]},{"id":"unity-gain-frequency","en":"unity-gain frequency","idn":"frekuensi gain satu","def":"Frekuensi tempat gain loop sama dengan 0 dB (|L| = 1).","mods":["M02c, M27"]},{"id":"uvm","en":"UVM","idn":"Universal Verification Methodology","def":"Pustaka dan metodologi standar berbasis SystemVerilog untuk membangun testbench.","mods":["M18"]},{"id":"variance","en":"variance","idn":"variansi","def":"Rata-rata kuadrat jarak dari rata-rata; kuadrat simpangan baku.","mods":["M01c"]},{"id":"vector","en":"vector","idn":"vektor","def":"Daftar bilangan berurutan; misalnya tegangan semua simpul sebuah rangkaian.","mods":["M01c"]},{"id":"vertex","en":"vertex","idn":"simpul","def":"Titik pada sebuah graf; juga disebut node.","mods":["M01c"]},{"id":"volatile","en":"volatile","idn":"volatile","def":"Kualifier C yang mewajibkan setiap akses benar-benar terjadi dalam urutan tertulis terhadap akses volatile lain; bukan atomik dan bukan barrier.","mods":["M04a, M15"]},{"id":"voltage","en":"voltage","idn":"tegangan","def":"Energi per satuan muatan antara dua titik, dalam volt.","mods":["M02","M02a"]},{"id":"vswr","en":"VSWR","idn":"rasio gelombang berdiri tegangan","def":"VSWR = (1 + |Γ|)/(1 − |Γ|); perbandingan tegangan maksimum dan minimum sepanjang saluran.","mods":["M02c"]},{"id":"wafer","en":"wafer","idn":"wafer","def":"Piringan silikon tipis tempat ratusan chip dibuat sekaligus; diameter umum 300 mm.","mods":["M00, M30"]},{"id":"write-1-to-clear","en":"write-1-to-clear","idn":"tulis-1-untuk-hapus","def":"Jenis bit register: menulis 1 menghapus flag itu dan menulis 0 tak berefek; baca-ubah-tulis menghapus semua flag aktif.","mods":["M04a, M15"]},{"id":"yield","en":"yield","idn":"yield","def":"Persentase die yang berfungsi dari seluruh die yang diproduksi.","mods":["M30"]},{"id":"z-transform","en":"Z-transform","idn":"transformasi Z","def":"Padanan Laplace untuk sinyal diskret; tunda satu sampel menjadi perkalian dengan z⁻¹.","mods":["M01d"]},{"id":"zero","en":"zero","idn":"nol","def":"Akar pembilang fungsi transfer; frekuensi kompleks yang diblokir sistem.","mods":["M01d"]}]});</script>
<style>

<script>
(function(){
'use strict';
var ICD = window.ICD, el = ICD.el, q = ICD.q, reg = ICD.reg, T = ICD_DATA.glosarium;
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function letter(t){ var c = norm(t.en).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; }
function mod3(m){ return String(m || '').slice(0, 3); }
function hl(text, toks){
  if (!toks.length) return [text];
  var re = new RegExp('(' + toks.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'ig'), out = [], last = 0, m;
  while ((m = re.exec(text))){ if (m.index > last) out.push(text.slice(last, m.index)); out.push(el('mark', { class: 'hit', text: m[0] })); last = m.index + m[0].length; if (m[0].length === 0) re.lastIndex++; }
  if (last < text.length) out.push(text.slice(last)); return out;
}
function modsOfTrack(k){ var set = {}; reg.files.forEach(function(f){ if (reg.tracks[k].files[f.id]) set[f.mod] = 1; }); return set; }
function render(){
  var raw = q('#g-q').value.trim(), toks = norm(raw).split(/\s+/).filter(Boolean), mod = q('#g-mod').value, tk = q('#g-track').value, tset = tk ? modsOfTrack(tk) : null;
  var list = T.filter(function(t){
    if (mod && !t.mods.some(function(m){ return mod3(m) === mod; })) return false;
    if (tset && !t.mods.some(function(m){ return tset[mod3(m)]; })) return false;
    var h = norm(t.en + ' ' + t.idn + ' ' + t.def); return toks.every(function(x){ return h.indexOf(x) >= 0; });
  });
  var box = q('#g-list'); box.textContent = ''; var have = {}, cur = null, dl = null;
  list.forEach(function(t){
    var L = letter(t); have[L] = 1;
    if (L !== cur){ cur = L; box.appendChild(el('h2', { class: 'gl-h', id: 'huruf-' + (L === '#' ? 'angka' : L.toLowerCase()), text: L })); dl = el('dl', { style: 'margin:0' }); box.appendChild(dl); }
    dl.appendChild(el('div', { class: 'term', id: 'istilah-' + t.id }, [
      el('dt', null, [el('span', null, hl(t.en, toks)), t.idn && norm(t.idn) !== norm(t.en) ? el('i', null, ['· '].concat(hl(t.idn, toks))) : null, el('a', { class: 'anc', href: '#istilah-' + t.id, 'aria-label': 'Tautan ke ' + t.en, text: '#' })]),
      el('dd', null, hl(t.def, toks).concat([t.mods.length ? el('div', { class: 'mods' }, t.mods.map(function(m){ return el('a', { href: 'kurikulum.html?modul=' + mod3(m), title: 'Lihat modul ' + mod3(m), text: m }); })) : null]))]));
  });
  if (!list.length) box.appendChild(el('div', { class: 'icd-empty' }, [el('h3', { text: 'Tidak ada istilah yang cocok' }), el('p', { text: 'Coba kata kunci lain, atau hapus filter modul dan Track.' })]));
  q('#g-count').textContent = list.length + ' dari ' + T.length + ' istilah';
  var az = q('#az'); az.textContent = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(function(L){
    var li = el('li'); if (have[L]) li.appendChild(el('a', { href: '#huruf-' + (L === '#' ? 'angka' : L.toLowerCase()), text: L, 'aria-label': 'Loncat ke huruf ' + L })); else li.appendChild(el('span', { text: L, 'aria-hidden': 'true' })); az.appendChild(li);
  });
  focusHash();
}
function focusHash(){ var h = window.location.hash; if (h.indexOf('#istilah-') === 0){ var t = document.getElementById(h.slice(1)); if (t){ t.scrollIntoView({ block: 'center' }); t.classList.add('flash'); setTimeout(function(){ t.classList.remove('flash'); }, 2500); } } }
ICD.ready(function(){
  q('#lead').textContent = T.length + ' istilah dari semua lesson yang sudah terbit. Istilah teknis memakai bahasa Inggris aslinya; padanan Indonesia ditulis di sebelahnya bila ada.';
  var mods = {}; T.forEach(function(t){ t.mods.forEach(function(m){ mods[mod3(m)] = 1; }); });
  q('#g-mod').appendChild(el('option', { value: '', text: 'Semua modul' }));
  Object.keys(mods).sort().forEach(function(m){ var mm = reg.module(m); q('#g-mod').appendChild(el('option', { value: m, text: m + (mm ? ' · ' + mm.title : '') })); });
  q('#g-track').appendChild(el('option', { value: '', text: 'Semua Track' })); Object.keys(reg.tracks).forEach(function(k){ q('#g-track').appendChild(el('option', { value: k, text: reg.tracks[k].title })); });
  var u = new URLSearchParams(window.location.search); if (u.get('q')) q('#g-q').value = u.get('q'); if (u.get('modul')) q('#g-mod').value = u.get('modul');
  ['input', 'change'].forEach(function(ev){ ['#g-q', '#g-mod', '#g-track'].forEach(function(s){ q(s).addEventListener(ev, render); }); });
  render(); window.addEventListener('hashchange', focusHash);
});
})();
</script>
</body>
</html>
